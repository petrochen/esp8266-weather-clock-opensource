[platformio]
src_dir = firmware/weather_clock
default_envs = esp01s

[env:esp01s]
platform = espressif8266@4.2.1
board = esp01_1m
framework = arduino
board_build.f_cpu = 80000000L
board_build.f_flash = 40000000L
board_build.flash_mode = dio
board_build.ldscript = eagle.flash.1m64.ld
upload_speed = 115200
monitor_speed = 115200
build_flags =
    -I firmware/weather_clock
    -DWM_NODEBUG
    -DWM_NOHELP
    -DWM_STRINGS_FILE=\"wm_strings_compact.h\"
    ; Keep the PlatformIO image within the mutual-OTA size budget.
    -fno-inline-small-functions
lib_deps =
    adafruit/Adafruit BusIO@1.17.4
    adafruit/Adafruit GFX Library@1.12.4
    adafruit/Adafruit SSD1306@2.5.16
    bblanchon/ArduinoJson@7.4.2
    tzapu/WiFiManager@2.0.17
    https://downloads.arduino.cc/libraries/github.com/dvarrel/ESPAsyncTCP-1.2.4.zip
    khoih-prog/AsyncHTTPRequest_Generic@1.13.0
